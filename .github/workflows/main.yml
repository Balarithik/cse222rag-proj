name: Django RAG CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Run Tests & Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: uv sync

      - name: Django Check
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: False
          DJANGO_SQLITE_PATH: db.sqlite3
          GOOGLE_API_KEY: dummy-key
          GEMINI_CHAT_MODEL: gemini-2.5-flash
          GEMINI_EMBEDDING_MODEL: text-embedding-004
        run: |
          uv run python manage.py check
          uv run python manage.py migrate --noinput

      - name: Collect Static
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: False
          DJANGO_SQLITE_PATH: db.sqlite3
          GOOGLE_API_KEY: dummy-key
        run: |
          uv run python manage.py collectstatic --noinput

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

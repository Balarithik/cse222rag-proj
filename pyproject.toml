[project]
name = "rag-django-app"
version = "0.1.0"
description = "A Django web application for document-grounded RAG using LangChain, FAISS, and Google Gemini."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=6.1,<6.2",
    "faiss-cpu>=1.12,<2",
    "gunicorn>=26.2.0",
    "langchain-community>=0.4,<0.5",
    "langchain-google-genai>=4.4,<5",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6,<7",
    "python-dotenv>=1.1,<2",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false
